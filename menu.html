<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página del Menú Gamer</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: url("imagenes/kwai.jpg") no-repeat center center fixed;
            background-size: cover;
            color: #00aaff;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 40px;
            text-shadow: 0 0 10px #00aaff;
            position: relative;
            z-index: 1;
            opacity: 0;
            animation: fadeIn 2s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .botonera {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
            z-index: 1;
        }

        .btn {
            padding: 15px 40px;
            border-radius: 10px;
            background: rgba(0, 170, 255, 0.2);
            backdrop-filter: blur(5px);
            color: #00aaff;
            text-decoration: none;
            font-size: 1.5rem;
            border: 2px solid rgba(0, 170, 255, 0.5);
            transition: 0.3s, transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            display: inline-block;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInButton 0.8s forwards;
        }

        .btn:nth-child(1) { animation-delay: 0.5s; }
        .btn:nth-child(2) { animation-delay: 0.8s; }
        .btn:nth-child(3) { animation-delay: 1.1s; }
        .btn:nth-child(4) { animation-delay: 1.4s; }

        @keyframes fadeInButton {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn:hover {
            background: rgba(0, 170, 255, 0.4);
            box-shadow: 0 0 15px #00aaff, 0 0 30px rgba(0, 170, 255, 0.5) inset;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <h1>Bienvenido al Menú Gamer 🎮</h1>

    <div class="botonera">
        <a href="redes.html" class="btn">Redes Sociales</a>
        <a href="discord.html" class="btn">Canal de Discord y más</a>
        <a href="index.html" class="btn">Volver al Inicio</a>
    </div>

</body>
</html>
