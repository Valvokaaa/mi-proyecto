<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenidos a Valvoka Works</title>
    <style>
        /* --------------------------------------------------
            ESTILOS BASE Y FONDO (DEFAULT: PC)
        ---------------------------------------------------*/
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            /* Fondo con imagen, FIJO por defecto (para PC) */
            background: url("imagenes/kwai.jpg") no-repeat center center fixed;
            background-size: cover;
            color: #00aaff;
            position: relative;
            overflow: hidden;
        }

        /* Capa oscurecedora para contraste */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: 0;
        }

        /* --------------------------------------------------
            CONTENEDOR DEL MENÚ (DEFAULT: PC)
        ---------------------------------------------------*/
        .contenido-principal {
            position: relative;
            z-index: 1;
            padding: 40px; /* Padding para PC */
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 30px rgba(0, 170, 255, 0.3);
            max-width: 90%;
            width: 450px; /* Ancho fijo para PC */
        }

        h1 {
            font-size: 3rem; /* Tamaño para PC */
            margin-bottom: 40px;
            text-shadow: 0 0 10px #00aaff;
            position: relative;
            z-index: 1;
            opacity: 0;
            animation: fadeIn 2s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .botonera {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        /* --------------------------------------------------
            BOTONES DE NAVEGACIÓN (DEFAULT: PC)
        ---------------------------------------------------*/
        .btn {
            padding: 18px 40px; /* Padding para PC */
            width: 100%;
            border-radius: 10px;
            text-decoration: none;
            background: rgba(0, 170, 255, 0.2);
            backdrop-filter: blur(5px);
            color: #00aaff;
            font-size: 1.5rem; /* Tamaño para PC */
            font-weight: bold;
            border: 2px solid rgba(0, 170, 255, 0.7);
            transition: 0.3s, transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            display: inline-block;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInButton 0.8s forwards;
            box-shadow: 0 0 10px rgba(0, 170, 255, 0.3);
        }

        .btn:nth-child(1) { animation-delay: 0.5s; }
        .btn:nth-child(2) { animation-delay: 0.8s; }
        .btn:nth-child(3) { animation-delay: 1.1s; }

        @keyframes fadeInButton {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn:hover {
            background: rgba(0, 170, 255, 0.4);
            box-shadow: 0 0 20px #00aaff, 0 0 40px rgba(0, 170, 255, 0.6) inset;
            transform: scale(1.05);
        }

        /* --------------------------------------------------
            BOTÓN DE MÚSICA (DEFAULT: PC)
        ---------------------------------------------------*/
        #toggleMusica {
            position: fixed;
            bottom: 25px;
            right: 25px;
            padding: 12px 20px;
            border-radius: 50%;
            z-index: 100;
            font-size: 1.4rem;
            
            background: rgba(0, 170, 255, 0.25);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(0, 170, 255, 0.8);
            box-shadow: 0 0 15px #00aaff;
            color: white;
            cursor: pointer;
            transition: 0.3s ease;
            outline: none;
        }

        #toggleMusica:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px #00aaff, 0 0 50px #00aaff inset;
            background: rgba(0, 170, 255, 0.4);
        }

        /* ==================================================
            ADAPTACIÓN PARA MÓVILES (Media Query: Pantallas de 600px o menos)
           ================================================== */
        @media (max-width: 600px) {
            
            /* 1. Optimización del Fondo */
            body {
                background-attachment: scroll; 
            }

            /* 2. Ajuste del Título */
            h1 {
                font-size: 2.2rem; /* Reducir el tamaño del título principal */
                margin-bottom: 30px;
            }

            /* 3. Ajuste del Contenedor Principal */
            .contenido-principal {
                padding: 30px 20px; /* Reducir el padding alrededor del contenido */
                width: 90%; /* Asegurar que no sea más ancho que la pantalla */
                max-width: none; /* Permitir que ocupe más espacio si es necesario */
            }

            /* 4. Ajuste de Botones de Navegación */
            .botonera {
                gap: 15px; /* Reducir el espacio entre botones */
            }

            .btn {
                padding: 15px 25px; /* Reducir el padding de los botones */
                font-size: 1.2rem; /* Reducir el tamaño de la fuente */
            }

            .btn:hover {
                transform: scale(1.03); /* Reducir el efecto hover en móvil */
            }

            /* 5. Ajuste del Botón de Música */
            #toggleMusica {
                bottom: 15px; 
                right: 15px;
                padding: 10px 15px; 
                font-size: 1.2rem; 
            }
        }
    </style>
</head>
<body>

    <audio id="musicaFondo" loop>
        <source src="audio/life_goes_on.mp3" type="audio/mpeg">
        Tu navegador no soporta el audio.
    </audio>

    <div class="contenido-principal">
        <h1>Bienvenidos a Valkiria World 🎮</h1>

        <div class="botonera">
            <a href="redes.html" class="btn">Redes Sociales</a>
            <a href="discord.html" class="btn">Canal de Discord y más</a>
            <a href="index.html" class="btn">Volver al Inicio</a>
        </div>
    </div>
    
    <button id="toggleMusica">♪</button>

    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            const musica = document.getElementById('musicaFondo');
            const boton = document.getElementById('toggleMusica');
            let estaReproduciendo = false;

            // Intenta reproducir al hacer clic.
            boton.addEventListener('click', function() {
                if (estaReproduciendo) {
                    musica.pause();
                    boton.textContent = '♪'; // Icono de música
                } else {
                    musica.play().catch(error => {
                        console.error("Error al reproducir el audio (el navegador pudo haber bloqueado el autoplay):", error);
                    });
                    boton.textContent = '⏸️'; // Icono de pausa
                }
                estaReproduciendo = !estaReproduciendo;
            });

            // Actualiza el icono si la música se detiene/inicia por otras razones (como al cambiar de pestaña)
            musica.onplay = () => {
                estaReproduciendo = true;
                boton.textContent = '⏸️';
            };
            musica.onpause = () => {
                estaReproduciendo = false;
                boton.textContent = '♪';
            };
        });
    </script>
</body>
</html>
