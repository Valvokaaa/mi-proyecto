<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página del Menú Gamer</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
                        url("imagenes/bt21.jpg") no-repeat center center fixed;
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 30px;
            text-shadow: 0 0 15px cyan;
        }
        img {
            max-width: 300px;
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 0 20px cyan;
            margin-bottom: 30px;
        }
        .btn {
            padding: 15px 30px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            color: white;
            text-decoration: none;
            font-size: 1.5rem;
            border: 2px solid rgba(255, 255, 255, 0.4);
            transition: 0.3s;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <h1>Bienvenido al Menú Gamer 🎮</h1>

   <img src="imagenes/kwai.jpg" alt="Imagen Kwai">


    <a href="index.html" class="btn">Volver al Inicio</a>

</body>
</html>
