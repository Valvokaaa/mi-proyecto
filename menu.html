<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página del Menú Gamer</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;

            /* Fondo usando la imagen kwai.jpg */
            background: url("imagenes/kwai.jpg") no-repeat center center fixed;
            background-size: cover;

            color: #00aaff; /* Color azul */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #00aaff;
        }
        .btn {
            padding: 15px 30px;
            border-radius: 10px;
            background: rgba(0, 170, 255, 0.15); /* Fondo semi-transparente azul */
            backdrop-filter: blur(4px);
            color: #00aaff; /* Texto azul */
            text-decoration: none;
            font-size: 1.5rem;
            border: 2px solid rgba(0, 170, 255, 0.5);
            transition: 0.3s;
            cursor: pointer;
        }
        .btn:hover {
            background: rgba(0, 170, 255, 0.3);
        }
    </style>
</head>
<body>

    <h1>Bienvenido al Menú Gamer 🎮</h1>

    <a href="index.html" class="btn">Volver al Inicio</a>

</body>
</html>
