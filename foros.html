<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foros y Comunidad</title>

<style>
/* --------------------------------------------------
   FONDO CYBERPUNK GRID 3D PRO (LILA)
---------------------------------------------------*/
body {
    margin: 0;
    font-family: "Orbitron", Arial, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    perspective: 1500px;
    background: radial-gradient(circle at center, #25002d, #0d0010 80%);
    overflow: hidden;
}

/* Grid 3D animado */
body::before {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    background:
        repeating-linear-gradient(0deg, transparent 0 25px, rgba(200, 0, 255, 0.35) 25px 27px),
        repeating-linear-gradient(90deg, transparent 0 25px, rgba(200, 0, 255, 0.35) 25px 27px);
    transform: rotateX(70deg) translateY(220px);
    transform-origin: top;
    animation: gridMove 6s linear infinite;
    opacity: 0.55;
}

@keyframes gridMove {
    from { transform: rotateX(70deg) translateY(220px) translateZ(0); }
    to   { transform: rotateX(70deg) translateY(220px) translateZ(-500px); }
}

/* Niebla cyberpunk */
body::after {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    background:
        radial-gradient(circle at 30% 80%, #7b00ff44, transparent 60%),
        radial-gradient(circle at 70% 20%, #ff00ff33, transparent 70%),
        radial-gradient(circle at 50% 50%, #c200ff22, transparent 60%);
    filter: blur(80px);
    animation: fogMove 12s ease-in-out infinite alternate;
    opacity: 0.65;
}

@keyframes fogMove {
    from { transform: scale(1) translate(0, 0); }
    to   { transform: scale(1.2) translate(30px, -40px); }
}

/* --------------------------------------------------
           PANEL PRINCIPAL 3D
---------------------------------------------------*/
.contenedor {
    position: relative;
    z-index: 10;

    background: rgba(25, 0, 40, 0.45);
    border: 2px solid rgba(200, 0, 255, 0.4);
    padding: 35px 45px;
    border-radius: 20px;
    backdrop-filter: blur(8px);

    width: 80%;
    max-width: 900px;

    box-shadow:
        0 0 30px rgba(200, 0, 255, 0.4),
        inset 0 0 20px rgba(100, 0, 150, 0.4);

    transform: rotateY(10deg) rotateX(5deg);
    animation: panelFloat 6s ease-in-out infinite alternate;
}

@keyframes panelFloat {
    from { transform: rotateY(10deg) rotateX(5deg) translateY(0); }
    to   { transform: rotateY(-10deg) rotateX(-3deg) translateY(-15px); }
}

/* Título */
h1 {
    text-align: center;
    font-size: 2.6rem;
    color: #d46cff;
    text-shadow:
        0 0 15px #d46cff,
        0 0 30px #9f00ff;
    margin-bottom: 40px;
}

/* --------------------------------------------------
           GRID DE CATEGORÍAS
---------------------------------------------------*/
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 25px;
}

.card {
    background: rgba(210, 0, 255, 0.15);
    border: 2px solid rgba(220, 0, 255, 0.4);
    border-radius: 12px;
    padding: 25px;
    text-align: center;
    font-size: 1.3rem;
    color: #e38cff;
    cursor: pointer;

    box-shadow:
        0 0 18px rgba(200, 0, 255, 0.5),
        inset 0 0 15px rgba(200, 0, 255, 0.25);

    transform-style: preserve-3d;
    transition: 0.35s;
}

/* Hover 3D */
.card:hover {
    transform: translateZ(30px) scale(1.07);
    background: rgba(220, 0, 255, 0.35);
    box-shadow:
        0 0 25px #ff78ff,
        0 0 40px #c700ff inset;
}

/* --------------------------------------------------
           BOTÓN VOLVER
---------------------------------------------------*/
.volver {
    display: block;
    margin: 40px auto 0;
    width: fit-content;

    padding: 12px 25px;
    background: rgba(210, 0, 255, 0.15);
    border: 2px solid rgba(220, 0, 255, 0.5);
    border-radius: 12px;
    text-decoration: none;
    font-size: 1.3rem;
    color: #e38cff;

    transition: 0.35s;
    transform-style: preserve-3d;
    box-shadow:
        0 0 18px rgba(200, 0, 255, 0.5),
        inset 0 0 15px rgba(200, 0, 255, 0.25);
}

.volver:hover {
    transform: translateZ(20px) scale(1.1);
    background: rgba(220, 0, 255, 0.35);
    box-shadow:
        0 0 25px #ff78ff,
        0 0 40px #c700ff inset;
}
</style>
</head>

<body>

<div class="contenedor">

    <h1>Foros y Comunidad</h1>

    <div class="grid">

        <div class="card">Noticias</div>

        <div class="card">Comunidad</div>

        <div class="card">Preguntas</div>

        <div class="card">Clips</div>

        <div class="card">Eventos</div>

        <div class="card">Soporte</div>

    </div>

    <a href="menu.html" class="volver">Volver al Menú</a>

</div>

</body>
</html>
