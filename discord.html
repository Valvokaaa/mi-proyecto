<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord - Menú Gamer</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">


<style>
/* --------------------------------------------------
    VARIABLES GLOBALES
---------------------------------------------------*/
:root {
    --color-primary-neon: #00ffff; /* Cyan brillante */
    --color-secondary-neon: #ff00ff; /* Magenta brillante */
    --color-discord: #5865F2; /* Azul Discord */
    --color-text-light: #e0f7fa;
    --color-bg-dark: #0a0110;
    --font-orbitron: 'Orbitron', sans-serif;
    --font-roboto-mono: 'Roboto Mono', monospace;
}

/* --------------------------------------------------
    BASE Y FONDO DE PARTÍCULAS (DEFAULT: PC)
---------------------------------------------------*/
body {
    margin: 0;
    font-family: var(--font-orbitron);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1800px;
    background: radial-gradient(circle at center, #1b022b, var(--color-bg-dark) 90%);
    overflow: hidden;
    color: var(--color-text-light);
    position: relative;

    /* Fondo de imagen, FIJO por defecto (para PC) */
    background: 
        linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
        url("imagenes/play.jpg") no-repeat center center fixed;
    background-size: cover;
}

/* Patrón de estrellas/partículas de fondo (PC) */
body::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: 
        radial-gradient(circle, rgba(0,255,255,0.15) 1px, transparent 1.5px) repeat,
        radial-gradient(circle, rgba(255,0,255,0.1) 1px, transparent 1.5px) repeat;
    background-size: 80px 80px, 120px 120px;
    background-position: 0 0, 40px 40px;
    animation: starfieldMove 60s linear infinite;
    opacity: 0.6;
    z-index: -2;
}

@keyframes starfieldMove {
    from { background-position: 0 0, 40px 40px; }
    to { background-position: 80px 80px, 120px 120px; }
}

/* Efecto de niebla/aurora (PC) */
body::after {
    content: "";
    position: absolute;
    width: 150%; height: 150%;
    background:
        radial-gradient(circle at 20% 70%, rgba(0, 255, 255, 0.2) 0%, transparent 60%),
        radial-gradient(circle at 80% 30%, rgba(255, 0, 255, 0.2) 0%, transparent 60%),
        radial-gradient(circle at 50% 50%, rgba(150, 0, 255, 0.15) 0%, transparent 70%);
    filter: blur(150px);
    animation: auroraFloat 18s ease-in-out infinite alternate;
    z-index: -1;
}

@keyframes auroraFloat {
    0% { transform: scale(1) translate(0, 0); opacity: 0.8; }
    50% { transform: scale(1.1) translate(50px, -30px); opacity: 0.9; }
    100% { transform: scale(1) translate(-20px, 40px); opacity: 0.8; }
}

/* --------------------------------------------------
    CONTENEDOR CENTRAL - "CRISTAL DE DATOS" 3D (DEFAULT: PC)
---------------------------------------------------*/
.contenedor {
    position: relative;
    z-index: 10;
    width: 400px;
    padding: 60px 40px;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(var(--color-primary-neon), 0.3);
    border-radius: 25px;
    backdrop-filter: blur(25px) saturate(180%);
    box-shadow: 0 0 50px rgba(var(--color-primary-neon), 0.5), inset 0 0 30px rgba(var(--color-primary-neon), 0.2);
    
    /* Efectos 3D y animaciones (Desactivar en móvil) */
    transform-style: preserve-3d;
    transform: rotateY(15deg) rotateX(8deg) translateZ(0); 
    animation: containerFloat 8s ease-in-out infinite alternate,
                containerGlow 3s ease-in-out infinite alternate;
}

/* Animaciones 3D y Glow (PC) */
@keyframes containerFloat { /* ... (mantenidas para PC) ... */ }
@keyframes containerGlow { /* ... (mantenidas para PC) ... */ }
.contenedor::before { /* Efecto de distorsión ligera (PC) */ }
@keyframes distortionGlow { /* ... (mantenidas para PC) ... */ }


/* --------------------------------------------------
    TITULO - "PROYECCIÓN NEÓN CON RUIDO" (DEFAULT: PC)
---------------------------------------------------*/
h1 {
    text-align: center;
    font-size: 3.8rem;
    color: var(--color-primary-neon);
    text-shadow: 0 0 15px var(--color-primary-neon), 0 0 30px var(--color-secondary-neon);
    margin-bottom: 60px;
    letter-spacing: 7px;
    text-transform: uppercase;
    position: relative;
    /* Animación y efectos Glitch (Desactivar en móvil) */
    animation: titleProject 6s ease-in-out infinite alternate; 
    line-height: 1;
}

/* Efecto de ruido/glitch (PC) */
h1::before, h1::after { /* ... (mantenidos para PC) ... */ }
@keyframes titleProject { /* ... (mantenidas para PC) ... */ }
@keyframes noiseEffect { /* ... (mantenidas para PC) ... */ }

/* --------------------------------------------------
    BOTONES Y BOTONERA (DEFAULT: PC)
---------------------------------------------------*/
.botonera {
    display: flex;
    flex-direction: column;
    gap: 30px;
    width: 100%;
    max-width: 350px;
    margin: 0 auto;
}

.btn {
    padding: 20px 30px;
    font-size: 1.3rem; /* Tamaño PC */
    /* ... otros estilos ... */
}


/* --------------------------------------------------
    BOTÓN DE MÚSICA (DEFAULT: PC)
---------------------------------------------------*/
#toggleMusica {
    position: fixed;
    bottom: 25px;
    right: 25px;
    padding: 12px 20px;
    font-size: 1.4rem; /* Tamaño PC */
    /* ... otros estilos ... */
}

/* --------------------------------------------------
    ELEMENTO DECORATIVO "AUDIO VISUALIZER" (DEFAULT: PC)
---------------------------------------------------*/
.audio-visualizer {
    bottom: 20px;
    /* ... otros estilos ... */
}

/* ==================================================
    ADAPTACIÓN PARA MÓVILES (Media Query: Pantallas de 600px o menos)
   ================================================== */
@media (max-width: 600px) {
    
    /* 1. Optimización del Fondo y Fluidez */
    body {
        /* Desactivar fondo fijo para mejor rendimiento */
        background-attachment: scroll; 
        /* Reducir la perspectiva, aunque ya no afecta tanto */
        perspective: none; 
    }
    
    body::before, body::after {
        /* Desactivar las animaciones de estrellas y auroras para mejorar la fluidez */
        animation: none !important;
    }


    /* 2. Simplificación del Contenedor (CLAVE para la fluidez) */
    .contenedor {
        /* Eliminar todas las transformaciones 3D */
        transform-style: flat;
        transform: none; 
        /* Desactivar animaciones de flotado y brillo */
        animation: none;
        /* Reducir el tamaño del contenedor en móvil */
        width: 90%; 
        max-width: none;
        padding: 40px 20px;
        /* Simplificar las sombras para menor costo */
        box-shadow: 0 0 20px rgba(var(--color-primary-neon), 0.4);
        /* Asegurar que el efecto de distorsión no se aplique si existe */
        transform-style: initial; 
    }
    
    .contenedor::before {
        animation: none; /* Eliminar animación de distorsión */
        border: none;
    }


    /* 3. Simplificación del Título */
    h1 {
        font-size: 2.2rem; /* Reducir el tamaño de la fuente */
        letter-spacing: 3px; /* Reducir el espaciado */
        margin-bottom: 40px;
        /* Desactivar animación y efectos glitch */
        animation: none;
        text-shadow: 0 0 10px var(--color-primary-neon); /* Simplificar sombra */
    }

    h1::before, h1::after {
        /* Desactivar por completo los efectos glitch/ruido */
        content: none; 
    }
    
    
    /* 4. Ajuste de Botones */
    .botonera {
        gap: 20px;
    }

    .btn {
        padding: 15px 20px;
        font-size: 1.1rem; /* Reducir la fuente del botón */
        box-shadow: 0 0 10px rgba(var(--color-primary-neon), 0.3);
    }
    
    .btn:hover {
        /* Ajustar el hover a un movimiento más sutil en móvil */
        transform: scale(1.02) translateY(-2px); 
    }

    /* 5. Ajuste del Botón de Música */
    #toggleMusica {
        bottom: 15px; 
        right: 15px;
        padding: 10px 15px; 
        font-size: 1.2rem; 
    }

    /* 6. Desactivar Visualizador de Audio (Mejora de rendimiento) */
    .audio-visualizer {
        display: none; 
    }
}
</style>
</head>

<body>

<audio id="musicaFondo" loop autoplay>
    <source src="audio/Night_changes.mp3" type="audio/mpeg">
    Tu navegador no soporta el audio.
</audio>
<div class="contenedor">
    <h1 data-text="Discord & Comunidad">Discord & Comunidad</h1>
    <div class="botonera">
        <a href="https://discord.gg/DfDjv4BJ" class="btn discord-btn" target="_blank" rel="noopener noreferrer">Unirse al Discord</a>
        <a href="comunidad.html" class="btn">Comunidad (RE & Warzone)</a>
        <a href="menu.html" class="btn">Volver al Menú Principal</a>
    </div>
    <div class="audio-visualizer">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>
</div>

<button id="toggleMusica">♪</button>

<script>
    // ... (El script de JavaScript se mantiene igual) ...
    document.addEventListener('DOMContentLoaded', (event) => {
        const musica = document.getElementById('musicaFondo');
        const boton = document.getElementById('toggleMusica');
        // El estado inicial asume que el 'autoplay' funcionará, pero puede fallar
        let estaReproduciendo = true; 

        // 1. Intenta la reproducción inicial (maneja promesas de autoplay)
        musica.play().then(() => {
            // Si funciona, el botón muestra la pausa
            boton.textContent = '⏸️';
        }).catch(error => {
            // Si el navegador bloquea el autoplay, el botón muestra el icono de reproducción
            console.log("El navegador bloqueó el autoplay. El usuario deberá interactuar para que suene.");
            estaReproduciendo = false; 
            boton.textContent = '♪';
        });

        // 2. Control al hacer clic en el botón
        boton.addEventListener('click', function() {
            if (estaReproduciendo) {
                musica.pause();
                boton.textContent = '♪'; // Icono de música
            } else {
                musica.play().catch(error => {
                    console.error("Error al reproducir el audio:", error);
                });
                boton.textContent = '⏸️'; // Icono de pausa
            }
            estaReproduciendo = !estaReproduciendo;
        });

        // 3. Control para mantener el icono correcto si la música se detiene/inicia por otras razones
        musica.onplay = () => {
            estaReproduciendo = true;
            boton.textContent = '⏸️';
        };
        musica.onpause = () => {
            estaReproduciendo = false;
            boton.textContent = '♪';
        };
    });
</script>
</body>
</html>
