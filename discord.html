<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discord - Menú Gamer</title>



<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">





<style>

/* --------------------------------------------------

    VARIABLES GLOBALES (Mejor organización)

---------------------------------------------------*/

:root {

    --color-primary-neon: #00ffff; /* Cyan brillante */

    --color-secondary-neon: #ff00ff; /* Magenta brillante */

    --color-discord: #5865F2; /* Azul Discord */

    --color-text-light: #e0f7fa;

    --color-bg-dark: #0a0110;

    --font-orbitron: 'Orbitron', sans-serif;

    --font-roboto-mono: 'Roboto Mono', monospace;

}



/* --------------------------------------------------

    BASE Y FONDO DE PARTÍCULAS

---------------------------------------------------*/

body {

    margin: 0;

    font-family: var(--font-orbitron);

    height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    perspective: 1800px; /* Perspectiva más profunda */

    background: radial-gradient(circle at center, #1b022b, var(--color-bg-dark) 90%);

    overflow: hidden;

    color: var(--color-text-light);

    position: relative;



     background: 

                linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),

                url("imagenes/play.jpg") no-repeat center center fixed;

            background-size: cover;

}



/* Patrón de estrellas/partículas de fondo */

body::before {

    content: '';

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    background: 

        radial-gradient(circle, rgba(0,255,255,0.15) 1px, transparent 1.5px) repeat,

        radial-gradient(circle, rgba(255,0,255,0.1) 1px, transparent 1.5px) repeat;

    background-size: 80px 80px, 120px 120px;

    background-position: 0 0, 40px 40px;

    animation: starfieldMove 60s linear infinite;

    opacity: 0.6;

    z-index: -2;

}



@keyframes starfieldMove {

    from { background-position: 0 0, 40px 40px; }

    to { background-position: 80px 80px, 120px 120px; }

}



/* Efecto de niebla/aurora más dinámico */

body::after {

    content: "";

    position: absolute;

    width: 150%; height: 150%;

    background:

        radial-gradient(circle at 20% 70%, rgba(0, 255, 255, 0.2) 0%, transparent 60%),

        radial-gradient(circle at 80% 30%, rgba(255, 0, 255, 0.2) 0%, transparent 60%),

        radial-gradient(circle at 50% 50%, rgba(150, 0, 255, 0.15) 0%, transparent 70%);

    filter: blur(150px);

    animation: auroraFloat 18s ease-in-out infinite alternate;

    z-index: -1;

}



@keyframes auroraFloat {

    0% { transform: scale(1) translate(0, 0); opacity: 0.8; }

    50% { transform: scale(1.1) translate(50px, -30px); opacity: 0.9; }

    100% { transform: scale(1) translate(-20px, 40px); opacity: 0.8; }

}



/* --------------------------------------------------

    CONTENEDOR CENTRAL - "CRISTAL DE DATOS" 3D

---------------------------------------------------*/

.contenedor {

    position: relative;

    z-index: 10;

    width: 400px;

    padding: 60px 40px;

    background: rgba(0, 0, 0, 0.4); /* Base transparente */

    border: 1px solid rgba(var(--color-primary-neon), 0.3);

    border-radius: 25px;

    backdrop-filter: blur(25px) saturate(180%); /* Efecto de cristal */

    box-shadow: 0 0 50px rgba(var(--color-primary-neon), 0.5), inset 0 0 30px rgba(var(--color-primary-neon), 0.2);

    transform-style: preserve-3d;

    transform: rotateY(15deg) rotateX(8deg) translateZ(0); /* Rotación 3D inicial */

    animation: containerFloat 8s ease-in-out infinite alternate,

                containerGlow 3s ease-in-out infinite alternate;

}



@keyframes containerFloat {

    0% { transform: rotateY(15deg) rotateX(8deg) translateY(0px) translateZ(0); }

    50% { transform: rotateY(-10deg) rotateX(-5deg) translateY(-20px) translateZ(50px); }

    100% { transform: rotateY(15deg) rotateX(8deg) translateY(0px) translateZ(0); }

}



@keyframes containerGlow {

    0%, 100% { border-color: rgba(var(--color-primary-neon), 0.5); box-shadow: 0 0 50px rgba(var(--color-primary-neon), 0.5); }

    50% { border-color: rgba(var(--color-secondary-neon), 0.7); box-shadow: 0 0 70px rgba(var(--color-secondary-neon), 0.7); }

}



/* Efecto de distorsión ligera en el contenedor */

.contenedor::before {

    content: "";

    position: absolute;

    inset: -2px; /* Ligeramente más grande que el contenedor */

    border: 2px solid var(--color-primary-neon);

    border-radius: inherit;

    opacity: 0;

    animation: distortionGlow 5s infinite;

    z-index: -1;

}



@keyframes distortionGlow {

    0%, 100% { opacity: 0; transform: scale(1); }

    10% { opacity: 0.3; transform: scale(1.02) rotate(1deg); }

    20% { opacity: 0; transform: scale(1); }

    30% { opacity: 0.2; transform: scale(1.01) rotate(-0.5deg); }

    40% { opacity: 0; transform: scale(1); }

    50% { opacity: 0.4; transform: scale(1.03) rotate(2deg); }

    60% { opacity: 0; transform: scale(1); }

}





/* --------------------------------------------------

    TITULO - "PROYECCIÓN NEÓN CON RUIDO"

---------------------------------------------------*/

h1 {

    text-align: center;

    font-size: 3.8rem;

    color: var(--color-primary-neon);

    text-shadow: 0 0 15px var(--color-primary-neon), 0 0 30px var(--color-secondary-neon);

    margin-bottom: 60px;

    letter-spacing: 7px;

    text-transform: uppercase;

    position: relative;

    animation: titleProject 6s ease-in-out infinite alternate;

    line-height: 1; /* Para evitar espacios extra */

}



/* Efecto de ruido/glitch */

h1::before, h1::after {

    content: attr(data-text);

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    text-shadow: none;

    background: transparent;

    overflow: hidden;

    z-index: -1; /* Detrás del texto principal */

}



h1::before {

    color: var(--color-secondary-neon);

    animation: noiseEffect 0.8s infinite alternate-reverse;

    filter: blur(1px);

    left: 2px;

}



h1::after {

    color: var(--color-primary-neon);

    animation: noiseEffect 1.2s infinite alternate-reverse;

    filter: blur(1px);

    left: -2px;

}



@keyframes titleProject {

    0%, 100% { transform: translateY(0); opacity: 1; text-shadow: 0 0 15px var(--color-primary-neon), 0 0 30px var(--color-secondary-neon); }

    50% { transform: translateY(-5px); opacity: 0.95; text-shadow: 0 0 20px var(--color-secondary-neon), 0 0 40px var(--color-primary-neon); }

}



@keyframes noiseEffect {

    0%, 100% { clip-path: inset(0 0 0 0); }

    10% { clip-path: inset(0 0 90% 0); }

    20% { clip-path: inset(80% 0 0 0); }

    30% { clip-path: inset(0 0 70% 0); }

    40% { clip-path: inset(50% 0 0 0); }

    50% { clip-path: inset(0 0 60% 0); }

    60% { clip-path: inset(70% 0 0 0); }

    70% { clip-path: inset(0 0 80% 0); }

    80% { clip-path: inset(60% 0 0 0); }

    90% { clip-path: inset(0 0 50% 0); }

}



/* --------------------------------------------------

    BOTONERA Y BOTONES - "INTERFACES INTERACTIVOS"

---------------------------------------------------*/

.botonera {

    display: flex;

    flex-direction: column;

    gap: 30px;

    width: 100%; /* Ajuste a 100% del contenedor */

    max-width: 350px; /* Ancho máximo para no desbordar */

    margin: 0 auto;

}



.btn {

    position: relative;

    padding: 20px 30px;

    background: rgba(var(--color-primary-neon), 0.08);

    color: var(--color-text-light);

    border: 2px solid var(--color-primary-neon);

    border-radius: 8px;

    font-size: 1.3rem;

    font-weight: 700;

    text-decoration: none;

    cursor: pointer;

    text-align: center;

    transition: all 0.4s ease-out;

    letter-spacing: 1px;

    overflow: hidden; /* Para el efecto de brillo */

    box-shadow: 0 0 15px rgba(var(--color-primary-neon), 0.3);

    transform: translateZ(0); /* Acelerar 3D */

}



/* Efecto de brillo de carga */

.btn::before {

    content: '';

    position: absolute;

    top: 0;

    left: -100%;

    width: 100%;

    height: 100%;

    background: linear-gradient(90deg, transparent, rgba(var(--color-primary-neon), 0.3), transparent);

    transition: all 0.6s ease;

    z-index: 1;

}



.btn:hover::before {

    left: 100%;

}



.btn:hover {

    background: rgba(var(--color-primary-neon), 0.2);

    border-color: var(--color-secondary-neon);

    color: var(--color-secondary-neon);

    box-shadow: 0 0 25px var(--color-secondary-neon), inset 0 0 15px var(--color-secondary-neon);

    transform: scale(1.03) translateY(-5px);

}



/* Ajuste específico para el botón de Discord */

.btn.discord-btn {

    border-color: var(--color-discord);

    color: var(--color-discord);

    box-shadow: 0 0 15px rgba(var(--color-discord), 0.5);

}



.btn.discord-btn::before {

    background: linear-gradient(90deg, transparent, rgba(var(--color-discord), 0.4), transparent);

}



.btn.discord-btn:hover {

    background: rgba(var(--color-discord), 0.3);

    color: #fff;

    box-shadow: 0 0 30px var(--color-discord), inset 0 0 20px var(--color-discord);

}





/* Animaciones de entrada (ajustadas para el nuevo estilo) */

.btn:nth-child(1){animation: entradaBtn 0.6s ease forwards;}

.btn:nth-child(2){animation: entradaBtn 0.9s ease forwards;}

.btn:nth-child(3){animation: entradaBtn 1.2s ease forwards;}



@keyframes entradaBtn {

    from{opacity:0;transform:translateY(30px) scale(0.9);}

    to{opacity:1;transform:translateY(0) scale(1);}

}



/* --------------------------------------------------

    BOTÓN DE MÚSICA (Copiado de menu.html)

---------------------------------------------------*/

#toggleMusica {

    position: fixed;

    bottom: 25px;

    right: 25px;

    padding: 12px 20px;

    border-radius: 50%;

    z-index: 100;

    font-size: 1.4rem;

    

    /* Usamos el color Neón Azul */

    background: rgba(0, 170, 255, 0.25);

    backdrop-filter: blur(8px);

    border: 2px solid rgba(0, 170, 255, 0.8);

    box-shadow: 0 0 15px #00aaff;

    color: white;

    cursor: pointer;

    transition: 0.3s ease;

    outline: none;

}



#toggleMusica:hover {

    transform: scale(1.1);

    box-shadow: 0 0 25px #00aaff, 0 0 50px #00aaff inset;

    background: rgba(0, 170, 255, 0.4);

}



/* --------------------------------------------------

    ELEMENTO DECORATIVO "AUDIO VISUALIZER"

---------------------------------------------------*/

.audio-visualizer {

    position: absolute;

    bottom: 20px;

    left: 50%;

    transform: translateX(-50%);

    display: flex;

    gap: 3px;

    height: 20px;

    align-items: flex-end;

    opacity: 0.7;

    z-index: 11;

}



.bar {

    width: 4px;

    background-color: var(--color-secondary-neon);

    height: 5px; /* Altura inicial */

    border-radius: 2px;

    animation: soundWave 1.5s ease-in-out infinite alternate;

}



.bar:nth-child(1) { animation-delay: 0.1s; }

.bar:nth-child(2) { animation-delay: 0.2s; }

.bar:nth-child(3) { animation-delay: 0.3s; }

.bar:nth-child(4) { animation-delay: 0.4s; }

.bar:nth-child(5) { animation-delay: 0.5s; }

.bar:nth-child(6) { animation-delay: 0.6s; }

.bar:nth-child(7) { animation-delay: 0.7s; }



@keyframes soundWave {

    0%, 100% { height: 5px; opacity: 0.7; }

    50% { height: 18px; opacity: 1; background-color: var(--color-primary-neon); }

}



</style>

</head>



<body>



<audio id="musicaFondo" loop autoplay>

    <source src="audio/Night_changes.mp3" type="audio/mpeg">

    Tu navegador no soporta el audio.

</audio>

<div class="contenedor">

    <h1 data-text="Discord & Comunidad">Discord & Comunidad</h1>

    <div class="botonera">

        <a href="https://discord.gg/DfDjv4BJ" class="btn discord-btn" target="_blank" rel="noopener noreferrer">Unirse al Discord</a>

        <a href="comunidad.html" class="btn">Comunidad (RE & Warzone)</a>

        <a href="menu.html" class="btn">Volver al Menú Principal</a>

    </div>

    <div class="audio-visualizer">

        <div class="bar"></div>

        <div class="bar"></div>

        <div class="bar"></div>

        <div class="bar"></div>

        <div class="bar"></div>

        <div class="bar"></div>

        <div class="bar"></div>

    </div>

</div>



<button id="toggleMusica">♪</button>



<script>

    document.addEventListener('DOMContentLoaded', (event) => {

        const musica = document.getElementById('musicaFondo');

        const boton = document.getElementById('toggleMusica');

        // El estado inicial asume que el 'autoplay' funcionará, pero puede fallar

        let estaReproduciendo = true; 



        // 1. Intenta la reproducción inicial (maneja promesas de autoplay)

        musica.play().then(() => {

            // Si funciona, el botón muestra la pausa

            boton.textContent = '⏸️';

        }).catch(error => {

            // Si el navegador bloquea el autoplay, el botón muestra el icono de reproducción

            console.log("El navegador bloqueó el autoplay. El usuario deberá interactuar para que suene.");

            estaReproduciendo = false; 

            boton.textContent = '♪';

        });



        // 2. Control al hacer clic en el botón

        boton.addEventListener('click', function() {

            if (estaReproduciendo) {

                musica.pause();

                boton.textContent = '♪'; // Icono de música

            } else {

                musica.play().catch(error => {

                    console.error("Error al reproducir el audio:", error);

                });

                boton.textContent = '⏸️'; // Icono de pausa

            }

            estaReproduciendo = !estaReproduciendo;

        });



        // 3. Control para mantener el icono correcto si la música se detiene/inicia por otras razones

        musica.onplay = () => {

            estaReproduciendo = true;

            boton.textContent = '⏸️';

        };

        musica.onpause = () => {

            estaReproduciendo = false;

            boton.textContent = '♪';

        };

    });

</script>

</body>

</html>
