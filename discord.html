<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord - Menú Gamer</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
/* --------------------------------------------------
    VARIABLES
---------------------------------------------------*/
:root {
    --color-discord: #5865F2; /* Azul Discord */
    --color-principal: #d46cff; /* Magenta Suave */
    --color-secundario: #00ffff; /* Cyan para contraste */
    --color-fondo: #25002d;
}

/* --------------------------------------------------
    FONDO (Mantenido y ligeramente ajustado)
---------------------------------------------------*/
body {
    margin: 0;
    font-family: 'Orbitron', sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1500px;
    background: radial-gradient(circle at center, var(--color-fondo), #0d0010 80%);
    overflow: hidden;
}

/* Rejilla 3D */
body::before {
    content: "";
    position: absolute;
    width: 200%; height: 200%;
    background:
        repeating-linear-gradient(0deg, transparent 0 25px, rgba(200,0,255,0.2) 25px 27px),
        repeating-linear-gradient(90deg, transparent 0 25px, rgba(200,0,255,0.2) 25px 27px);
    transform: rotateX(70deg) translateY(220px);
    transform-origin: top;
    animation: gridMove 6s linear infinite;
    opacity: 0.4;
}
@keyframes gridMove {
    from { transform: rotateX(70deg) translateY(220px) translateZ(0); }
    to   { transform: rotateX(70deg) translateY(220px) translateZ(-500px); }
}

/* Niebla/Luces de fondo */
body::after {
    content: "";
    position: absolute;
    width: 200%; height: 200%;
    background:
        radial-gradient(circle at 30% 80%, #7b00ff44, transparent 60%),
        radial-gradient(circle at 70% 20%, #ff00ff33, transparent 70%),
        radial-gradient(circle at 50% 50%, #c200ff22, transparent 60%);
    filter: blur(100px);
    animation: fogMove 12s ease-in-out infinite alternate;
    opacity: 0.65;
}
@keyframes fogMove { from { transform: scale(1) translate(0,0); } to { transform: scale(1.2) translate(30px,-40px); } }

/* --------------------------------------------------
    CONTENEDOR CENTRAL (Holográfico y Glitch)
---------------------------------------------------*/
.contenedor {
    position: relative;
    z-index: 10;
    background: rgba(0, 0, 0, 0.4); /* Fondo más oscuro */
    border: 3px solid var(--color-principal);
    padding: 50px 70px;
    border-radius: 15px;
    backdrop-filter: blur(15px); /* Más blur */
    box-shadow: 0 0 40px var(--color-principal), inset 0 0 25px rgba(255, 255, 255, 0.1);
    transform: rotateY(10deg) rotateX(5deg);
    animation: panelFloat 6s ease-in-out infinite alternate, borderGlitch 3s steps(10) infinite; /* Añadimos borderGlitch */
}
@keyframes panelFloat { from { transform: rotateY(10deg) rotateX(5deg) translateY(0); } to { transform: rotateY(-10deg) rotateX(-3deg) translateY(-15px); } }

/* Animación de borde tipo Glitch/Error */
@keyframes borderGlitch {
    0%, 100% { border-color: var(--color-principal); }
    20% { border-color: var(--color-secundario); box-shadow: 0 0 40px var(--color-secundario); }
    40% { border-color: red; }
    60% { border-color: var(--color-principal); }
    80% { border-color: var(--color-secundario); }
}

/* --------------------------------------------------
    TITULO (Holograma Desvanecido)
---------------------------------------------------*/
h1 {
    text-align: center;
    font-size: 3.2rem;
    color: var(--color-principal);
    text-shadow: 0 0 10px var(--color-principal), 0 0 20px var(--color-principal);
    margin-bottom: 50px;
    letter-spacing: 5px;
    text-transform: uppercase;
    animation: holoFade 4s linear infinite alternate;
}

@keyframes holoFade {
    0% { opacity: 1; text-shadow: 0 0 10px var(--color-principal), 0 0 20px var(--color-principal); }
    50% { opacity: 0.85; text-shadow: 0 0 5px var(--color-secundario); }
    100% { opacity: 1; text-shadow: 0 0 10px var(--color-principal), 0 0 20px var(--color-principal); }
}

/* --------------------------------------------------
    BOTONERA Y BOTONES (Estilo Chip de Datos)
---------------------------------------------------*/
.botonera {
    display: flex;
    flex-direction: column;
    gap: 25px;
    width: 300px; /* Ancho fijo para mejorar el diseño */
}
.btn {
    position: relative;
    padding: 18px 35px;
    background: rgba(210,0,255,0.1);
    color: #fff;
    border: 1px solid var(--color-secundario);
    border-left: 5px solid var(--color-secundario); /* Énfasis en el borde izquierdo */
    border-radius: 5px;
    font-size: 1.25rem;
    text-decoration: none;
    cursor: pointer;
    text-align: left; /* Alineación izquierda */
    transition: 0.3s ease, transform 0.3s;
    text-shadow: 0 0 5px var(--color-secundario);
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
}

.btn:hover {
    transform: translateX(10px); /* Movimiento tipo deslizamiento */
    background: rgba(0, 255, 255, 0.2);
    border-color: var(--color-secundario);
    border-left-color: var(--color-principal); /* Cambio de color al hacer hover */
    box-shadow: 0 0 20px var(--color-secundario), inset 0 0 10px var(--color-secundario);
}

/* Botón de Discord con color específico */
.btn:nth-child(1) {
    border-left-color: var(--color-discord);
    text-shadow: 0 0 5px var(--color-discord);
    animation: entrada 0.5s ease forwards;
}
.btn:nth-child(1):hover {
    border-left-color: var(--color-discord);
    box-shadow: 0 0 20px var(--color-discord), inset 0 0 10px var(--color-discord);
}

/* Animaciones de entrada (mantenidas) */
.btn:nth-child(2){animation:entrada 0.8s ease forwards;}
.btn:nth-child(3){animation:entrada 1.1s ease forwards;}
@keyframes entrada { from{opacity:0;transform:translateY(40px);} to{opacity:1;transform:translateY(0);} }

/* --------------------------------------------------
    EFECTO AUDIO WAVES (Pequeña barra decorativa)
---------------------------------------------------*/
.btn::after {
    content: '>>'; /* Símbolo decorativo */
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.8rem;
    color: var(--color-secundario);
    opacity: 0.7;
    transition: 0.3s;
}
.btn:hover::after {
    color: var(--color-principal);
    opacity: 1;
}

</style>
</head>
<body>
<div class="contenedor">
    <h1>Discord y Comunidad</h1>
    <div class="botonera">
        <a href="https://discord.gg/DfDjv4BJ" class="btn" target="_blank" rel="noopener noreferrer">Unirse al Discord</a>
        <a href="comunidad.html" class="btn">Comunidad (RE/Warzone)</a>
        <a href="menu.html" class="btn">Volver al Menú Principal</a>
    </div>
</div>
</body>
</html>
