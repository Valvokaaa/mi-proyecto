<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord - Menú Gamer</title>

<style>
/* ---------------------------
   FONDO 3D CON PROFUNDIDAD
---------------------------- */
body {
    margin: 0;
    font-family: "Orbitron", Arial, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1400px;
    background: radial-gradient(circle at center, #00111a, #000000 80%);
    overflow: hidden;
}

/* Grid futurista animado */
body::before {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    background:
        repeating-linear-gradient(90deg, transparent 0 20px, rgba(0,255,255,0.1) 20px 21px),
        repeating-linear-gradient(0deg, transparent 0 20px, rgba(255,0,255,0.15) 20px 21px);
    transform: rotateX(65deg) translateY(150px);
    transform-origin: top;
    animation: gridMove 5s linear infinite;
    opacity: 0.4;
}
@keyframes gridMove {
    from { transform: rotateX(65deg) translateY(150px) translateZ(0); }
    to   { transform: rotateX(65deg) translateY(150px) translateZ(-400px); }
}

/* ---------------------------
     CONTENEDOR PRINCIPAL
---------------------------- */
.contenedor {
    position: relative;
    z-index: 5;
    background: rgba(0, 0, 20, 0.45);
    border: 2px solid rgba(0,255,255,0.4);
    padding: 40px 60px;
    border-radius: 20px;
    backdrop-filter: blur(8px);
    box-shadow: 0 0 30px rgba(0,255,255,0.4);
    transform: rotateY(10deg) rotateX(5deg);
    animation: panelFloat 6s ease-in-out infinite alternate;
}

@keyframes panelFloat {
    from { transform: rotateY(10deg) rotateX(5deg) translateY(0); }
    to   { transform: rotateY(-10deg) rotateX(-5deg) translateY(-15px); }
}

/* ---------------------------
            TÍTULO
---------------------------- */
h1 {
    text-align: center;
    font-size: 2.8rem;
    color: #00ffff;
    text-shadow: 0 0 15px #00ffff, 0 0 30px #ff00ff;
    margin-bottom: 40px;
    animation: aparecer 1s ease;
}
@keyframes aparecer {
    from { opacity: 0; transform: translateY(-30px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ---------------------------
            BOTONES 3D
---------------------------- */
.botonera {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.btn {
    padding: 15px 35px;
    background: rgba(0, 255, 255, 0.15);
    color: #00ffff;
    border: 2px solid rgba(0,255,255,0.5);
    border-radius: 12px;
    font-size: 1.4rem;
    text-decoration: none;
    cursor: pointer;
    display: inline-block;
    text-align: center;
    transition: 0.35s ease;
    position: relative;

    /* Efecto 3D */
    transform-style: preserve-3d;
    transform: translateZ(0px);
    box-shadow:
        0 0 12px rgba(0,255,255,0.4),
        inset 0 0 15px rgba(0,255,255,0.2);
}

/* Capa glowing detrás del botón */
.btn::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: rgba(0,255,255,0.2);
    filter: blur(25px);
    z-index: -1;
    opacity: 0;
    transition: 0.4s;
}

/* Hover 3D */
.btn:hover {
    transform: translateZ(25px) scale(1.1);
    background: rgba(0, 255, 255, 0.35);
    box-shadow:
        0 0 25px #00ffff,
        0 0 40px #ff00ff inset;
}

.btn:hover::before {
    opacity: 1;
}

/* Animación de entrada escalonada */
.btn:nth-child(1) { animation: entrada 0.6s ease forwards; }
.btn:nth-child(2) { animation: entrada 0.9s ease forwards; }
.btn:nth-child(3) { animation: entrada 1.2s ease forwards; }

@keyframes entrada {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="contenedor">

    <h1>Canal de Discord y Más</h1>

    <div class="botonera">

        <a href="https://discord.gg/DfDjv4BJ" class="btn" target="_blank">Unirse al Discord</a>

        <a href="#" class="btn">Foros y Comunidad</a>

        <a href="menu.html" class="btn">Volver al Menú</a>

    </div>

</div>

</body>
</html>
