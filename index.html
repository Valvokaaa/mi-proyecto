<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Gamer</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;

            /* Fondo con imagen y capa oscurecida */
            background: 
                linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
                url("imagenes/bt21.jpg") no-repeat center center fixed;
            background-size: cover;

            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        nav {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 🌟 Botón mejorado Glassmorphism Gamer */
        .btn {
            padding: 22px 45px;
            border-radius: 20px;

            background: rgba(0, 255, 255, 0.18);
            backdrop-filter: blur(12px);

            border: 2px solid rgba(0, 255, 255, 0.7);
            color: white;
            font-size: 2.1rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;

            box-shadow:
                0 0 20px #00eaff,
                0 0 40px #00eaff inset,
                0 0 10px rgba(255, 255, 255, 0.3);

            transition: 0.4s ease;
            cursor: pointer;

            animation: flotar 3s ease-in-out infinite;
        }

        /* Hover brillante */
        .btn:hover {
            transform: scale(1.1);
            box-shadow:
                0 0 30px #00f7ff,
                0 0 60px #00f7ff inset,
                0 0 15px rgba(255, 255, 255, 0.5);
            background: rgba(0, 255, 255, 0.28);
        }

        /* ✨ Animación flotante */
        @keyframes flotar {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>

<body>
    <nav>
        <a href="menu.html" class="btn">Menú Gamer</a>
    </nav>
</body>
</html>
