<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | Proyecto Gamer</title>

    <style>
        /* --------------------------------------------------
            ESTILOS BASE Y FONDO
        ---------------------------------------------------*/
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            
            /* Fondo con imagen, capa oscurecida y FIJO por defecto (para PC) */
            background: 
                linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
                url("imagenes/bt21.jpg") no-repeat center center fixed;
            background-size: cover;

            color: white;
            position: relative; 
            overflow: hidden;
        }

        nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1; 
        }

        /* --------------------------------------------------
            BOTÓN PRINCIPAL (Menú Gamer) - ESTILOS BASE (PC/Grandes)
        ---------------------------------------------------*/
        .btn {
            padding: 22px 45px;
            border-radius: 20px;
            text-decoration: none; 

            /* Estilos Glassmorphism/Neón */
            background: rgba(0, 255, 255, 0.18);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(0, 255, 255, 0.7);
            color: white;
            font-size: 2.1rem; /* Tamaño para PC */
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;

            box-shadow:
                0 0 20px #00eaff,
                0 0 40px #00eaff inset,
                0 0 10px rgba(255, 255, 255, 0.3);

            transition: 0.4s ease;
            cursor: pointer;
            animation: flotar 3s ease-in-out infinite;
        }

        /* Hover brillante (PC) */
        .btn:hover {
            transform: scale(1.1);
            box-shadow:
                0 0 30px #00f7ff,
                0 0 60px #00f7ff inset,
                0 0 15px rgba(255, 255, 255, 0.5);
            background: rgba(0, 255, 255, 0.28);
        }

        /* ✨ Animación flotante */
        @keyframes flotar {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        /* --------------------------------------------------
            BOTÓN DE MÚSICA (Fondo flotante)
        ---------------------------------------------------*/
        #toggleMusica {
            position: fixed;
            bottom: 25px;
            right: 25px;
            padding: 12px 20px;
            border-radius: 50%;
            z-index: 100;
            font-size: 1.4rem;
            
            /* Estilo Neón/Glassmorphism Magenta */
            background: rgba(255, 0, 255, 0.18);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 0, 255, 0.7);
            box-shadow: 0 0 15px #ff00ff;
            color: white;
            cursor: pointer;
            transition: 0.3s ease;
            outline: none;
        }

        #toggleMusica:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px #ff00ff, 0 0 50px #ff00ff inset;
            background: rgba(255, 0, 255, 0.28);
        }

        /* ==================================================
            ADAPTACIÓN PARA MÓVILES (Media Query: Pantallas de 600px o menos)
           ================================================== */
        @media (max-width: 600px) {
            
            /* 1. Optimización del Fondo para Móviles */
            body {
                /* Cambiar de 'fixed' a 'scroll' mejora el rendimiento y la visualización en móviles */
                background-attachment: scroll; 
            }

            /* 2. Ajuste del Botón Principal para Móviles */
            .btn {
                padding: 15px 30px; /* Reducir el padding */
                font-size: 1.5rem;  /* Reducir el tamaño de la fuente */
                letter-spacing: 1px; /* Reducir el espaciado */
                box-shadow: /* Reducir las sombras para un look más limpio en móvil */
                    0 0 15px #00eaff,
                    0 0 30px #00eaff inset;
            }

            .btn:hover {
                transform: scale(1.05); /* Reducir el efecto hover en móvil */
            }

            /* 3. Ajuste del Botón de Música para Móviles */
            #toggleMusica {
                bottom: 15px; /* Mover más cerca de la esquina */
                right: 15px;
                padding: 10px 15px; /* Reducir el tamaño */
                font-size: 1.2rem; /* Reducir la fuente del icono */
            }
        }
    </style>
</head>

<body>
    
    <audio id="musicaFondo" loop>
        <source src="audio/bts_dynamite.mp3" type="audio/mpeg">
        Tu navegador no soporta el audio.
    </audio>

    <nav>
        <a href="menu.html" class="btn">Menú Gamer</a>
    </nav>
    
    <button id="toggleMusica">♪</button>

    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            const musica = document.getElementById('musicaFondo');
            const boton = document.getElementById('toggleMusica');
            let estaReproduciendo = false;

            boton.addEventListener('click', function() {
                if (estaReproduciendo) {
                    musica.pause();
                    boton.textContent = '♪';
                } else {
                    musica.play().catch(error => {
                        console.error("Error al reproducir el audio:", error);
                    });
                    boton.textContent = '⏸️';
                }
                estaReproduciendo = !estaReproduciendo;
            });

            musica.onplay = () => {
                estaReproduciendo = true;
                boton.textContent = '⏸️';
            };
            musica.onpause = () => {
                estaReproduciendo = false;
                boton.textContent = '♪';
            };
        });
    </script>
</body>
</html>
