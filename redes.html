<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redes Sociales - Menú Gamer</title>

<!-- ⭐ Importar visor 3D Spline -->
<script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.48/build/spline-viewer.js"></script>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: #00ffff;
    overflow: hidden;
    background: linear-gradient(#1a001a, #000000);
    position: relative;
}

/* Fondo 3D tipo Grid futurista */
body::before {
    content: '';
    position: absolute;
    width: 200%;
    height: 200%;
    background: repeating-linear-gradient(0deg, transparent, transparent 20px, rgba(0,255,255,0.2) 20px, rgba(0,255,255,0.2) 21px),
                repeating-linear-gradient(90deg, transparent, transparent 20px, rgba(255,0,255,0.2) 20px, rgba(255,0,255,0.2) 21px);
    background-size: 100% 100%;
    transform: rotateX(60deg) translateY(50%) scaleY(0.5);
    z-index: 0;
    animation: gridMove 5s linear infinite;
    pointer-events: none;
}

@keyframes gridMove {
    from { transform: rotateX(60deg) translateY(50%) scaleY(0.5) translateZ(0); }
    to   { transform: rotateX(60deg) translateY(50%) scaleY(0.5) translateZ(-500px); }
}

h1 {
    font-size: 3rem;
    text-shadow: 0 0 10px #00ffff, 0 0 20px #ff00ff;
    position: relative;
    z-index: 1;
    animation: fadeIn 1.5s ease-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-30px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* CONTENEDOR DEL MODELO 3D */
.model3d {
    width: 350px;
    height: 350px;
    margin-top: -40px;
    margin-bottom: -10px;
    z-index: 3;
}

/* Contenedor tarjetas 3D */
.social-container {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    gap: 25px;
    position: relative;
    z-index: 2;
}

/* TARJETAS 3D */
.social-card {
    width: 260px;
    padding: 18px 20px;
    border-radius: 15px;
    text-decoration: none;
    color: white;
    font-size: 1.6rem;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transform: perspective(600px) rotateX(10deg);
    transition: 0.4s ease;
    box-shadow: 0 0 20px #00ffff80;
    animation: float 4s ease-in-out infinite;
}

/* Movimiento flotante */
@keyframes float {
    0%   { transform: perspective(600px) translateY(0px) rotateX(10deg); }
    50%  { transform: perspective(600px) translateY(-12px) rotateX(12deg); }
    100% { transform: perspective(600px) translateY(0px) rotateX(10deg); }
}

/* Hover */
.social-card:hover {
    transform: perspective(600px) rotateX(2deg) scale(1.07);
    box-shadow: 0 0 25px #00ffff, 0 0 40px #ff00ff;
}

/* Iconos */
.social-card img {
    width: 45px;
    filter: drop-shadow(0 0 10px white);
}

/* Colores */
.instagram { background: #E1306C; box-shadow: 0 0 15px #E1306C88; }
.tiktok    { background: #000000; box-shadow: 0 0 15px #00ffff88; }
.twitch    { background: #9146FF; box-shadow: 0 0 15px #9146FF88; }
.youtube   { background: #FF0000; box-shadow: 0 0 15px #FF000088; }

/* Botón menú */
.btn-menu {
    margin-top: 40px;
    padding: 15px 40px;
    border-radius: 10px;
    background: rgba(0, 255, 255, 0.25);
    color: #00ffff;
    text-decoration: none;
    font-size: 1.5rem;
    border: 2px solid rgba(0, 255, 255, 0.6);
    transition: 0.3s;
    position: relative;
    z-index: 2;
}

.btn-menu:hover {
    background: rgba(0, 255, 255, 0.5);
    transform: scale(1.1);
    box-shadow: 0 0 15px #00ffff;
}

</style>
</head>
<body>

<!-- ⭐ MODELO 3D -->
<div class="model3d">
    <spline-viewer url="https://prod.spline.design/0ZCxGmpIzksAKOYP/scene.splinecode"></spline-viewer>
</div>

<h1>Mis Redes Sociales</h1>

<div class="social-container">

    <!-- Instagram -->
    <a href="https://www.instagram.com/valvokaa.ioach.drummer?igsh=a3RxMjEyNXVteHF3"
       target="_blank"
       class="social-card instagram">
        <span>Instagram</span>
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png">
    </a>

    <!-- TikTok -->
    <a href="https://www.tiktok.com/@valvokaa.drummer?_r=1&_t=ZS-91jZTybcSDU"
       target="_blank"
       class="social-card tiktok">
        <span>TikTok</span>
        <img src="https://upload.wikimedia.org/wikipedia/en/0/0a/TikTok_logo.svg">
    </a>

    <!-- Twitch -->
    <a href="https://www.twitch.tv/valutoer"
       target="_blank"
       class="social-card twitch">
        <span>Twitch</span>
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/26/Twitch_logo.svg">
    </a>

    <!-- YouTube -->
    <a href="https://www.youtube.com/@Valvoka_drummer"
       target="_blank"
       class="social-card youtube">
        <span>YouTube</span>
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg">
    </a>

</div>

<a href="menu.html" class="btn-menu">Volver al Menú</a>

</body>
</html>
