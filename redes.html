<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redes Sociales - Menú Gamer</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: #00ffff;
    overflow: hidden;
    background: linear-gradient(#1a001a, #000000);
    position: relative;
}

/* Fondo 3D tipo Grid futurista */
body::before {
    content: '';
    position: absolute;
    width: 200%;
    height: 200%;
    background: repeating-linear-gradient(0deg, transparent, transparent 20px, rgba(0,255,255,0.2) 20px, rgba(0,255,255,0.2) 21px),
                repeating-linear-gradient(90deg, transparent, transparent 20px, rgba(255,0,255,0.2) 20px, rgba(255,0,255,0.2) 21px);
    background-size: 100% 100%;
    transform: rotateX(60deg) translateY(50%) scaleY(0.5);
    z-index: 0;
    animation: gridMove 5s linear infinite;

    /* ⭐ Para que no bloquee clicks */
    pointer-events: none;
}

@keyframes gridMove {
    from { transform: rotateX(60deg) translateY(50%) scaleY(0.5) translateZ(0); }
    to   { transform: rotateX(60deg) translateY(50%) scaleY(0.5) translateZ(-500px); }
}

h1 {
    font-size: 3rem;
    text-shadow: 0 0 10px #00ffff, 0 0 20px #ff00ff;
    position: relative;
    z-index: 1;
    animation: fadeIn 1.5s ease-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-30px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* Contenedor de tarjetas 3D */
.social-container {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    gap: 25px;
    position: relative;
    z-index: 2;
}

/* TARJETAS 3D */
.social-card {
    width: 260px;
    padding: 18px 20px;
    border-radius: 15px;
    text-decoration: none;
    color: white;
    font-size: 1.6rem;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;

    /* 3D holográfico */
    transform: perspective(600px) rotateX(10deg);
    transition: 0.4s ease;
    box-shadow: 0 0 20px #00ffff80;
    animation: float 4s ease-in-out infinite;
}

/* Movimiento flotante 3D */
@keyframes float {
    0%   { transform: perspective(600px) translateY(0px) rotateX(10deg); }
    50%  { transform: perspective(600px) translateY(-12px) rotateX(12deg); }
    100% { transform: perspective(600px) translateY(0px) rotateX(10deg); }
}

/* HOVER 3D */
.social-card:hover {
    transform: perspective(600px) rotateX(2deg) scale(1.07);
    box-shadow: 0 0 25px #00ffff, 0 0 40px #ff00ff;
}

/* ICONOS */
.social-card img {
    width: 45px;
    filter: drop-shadow(0 0 10px white);
}

/* COLORES POR PLATAFORMA */
.instagram {
    background: #E1306C;
    box-shadow: 0 0 15px #E1306C88;
}

.tiktok {
    background: #000000;
    box-shadow: 0 0 15px #00ffff88;
}

.twitch {
    background: #9146FF;
    box-shadow: 0 0 15px #9146FF88;
}

.youtube {
    background: #FF0000;
    box-shadow: 0 0 15px #FF000088;
}

/* BOTÓN MENU */
.btn-menu {
    margin-top: 40px;
    padding: 15px 40px;
    border-radius: 10px;
    background: rgba(0, 255, 255, 0.25);
    color: #00ffff;
    text-decoration: none;
    font-size: 1.5rem;
    border: 2px solid rgba(0, 255, 255, 0.6);
    transition: 0.3s;
    position: relative;
    z-index: 2;
}

.btn-menu:hover {
    background: rgba(0, 255, 255, 0.5);
    transform: scale(1.1);
    box-shadow: 0 0 15px #00ffff;
}

/* --------------------------------------------------
    BOTÓN DE MÚSICA (CSS Copiado)
---------------------------------------------------*/
#toggleMusica {
    position: fixed;
    bottom: 25px;
    right: 25px;
    padding: 12px 20px;
    border-radius: 50%;
    z-index: 100;
    font-size: 1.4rem;
    
    /* Usamos el color cian/neón que predomina en el fondo */
    background: rgba(0, 255, 255, 0.25); 
    backdrop-filter: blur(8px);
    border: 2px solid rgba(0, 255, 255, 0.8);
    box-shadow: 0 0 15px #00ffff;
    color: white;
    cursor: pointer;
    transition: 0.3s ease;
    outline: none;
}

#toggleMusica:hover {
    transform: scale(1.1);
    box-shadow: 0 0 25px #00ffff, 0 0 50px #00ffff inset;
    background: rgba(0, 255, 255, 0.4);
}
</style>
</head>
<body>

<audio id="musicaFondo" loop autoplay>
    <source src="audio/my universe.mp3" type="audio/mpeg">
    Tu navegador no soporta el audio.
</audio>
<h1>Mis Redes Sociales</h1>

<div class="social-container">

    <a href="https://www.instagram.com/valvokaa.ioach.drummer?igsh=a3RxMjEyNXVteHF3"
        target="_blank"
        class="social-card instagram">
        <span>Instagram</span>
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png">
    </a>

    <a href="https://www.tiktok.com/@valvokaa.drummer?_r=1&_t=ZS-91jZTybcSDU"
        target="_blank"
        class="social-card tiktok">
        <span>TikTok</span>
        <img src="https://seeklogo.com/images/T/tiktok-icon-logo-B9AC5FE794-seeklogo.com.png">
    </a>

    <a href="https://www.twitch.tv/valvoka_ioachdrummer"
        target="_blank"
        class="social-card twitch">
        <span>Twitch</span>
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/26/Twitch_logo.svg">
    </a>

    <a href="https://www.youtube.com/@Valvoka_drummer"
        target="_blank"
        class="social-card youtube">
        <span>YouTube</span>
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg">
    </a>

</div>

<a href="menu.html" class="btn-menu">Volver al Menú</a>

<button id="toggleMusica">♪</button>

<script>
    document.addEventListener('DOMContentLoaded', (event) => {
        const musica = document.getElementById('musicaFondo');
        const boton = document.getElementById('toggleMusica');
        // El estado inicial asume que el 'autoplay' funcionará
        let estaReproduciendo = true; 

        // 1. Intenta la reproducción inicial (maneja promesas de autoplay)
        musica.play().then(() => {
            // Si funciona, el botón muestra la pausa
            boton.textContent = '⏸️';
        }).catch(error => {
            // Si el navegador bloquea el autoplay, el botón muestra el icono de reproducción
            console.log("El navegador bloqueó el autoplay. El usuario deberá interactuar para que suene.");
            estaReproduciendo = false; 
            boton.textContent = '♪';
        });

        // 2. Control al hacer clic en el botón
        boton.addEventListener('click', function() {
            if (estaReproduciendo) {
                musica.pause();
                boton.textContent = '♪'; // Icono de música
            } else {
                musica.play().catch(error => {
                    console.error("Error al reproducir el audio:", error);
                });
                boton.textContent = '⏸️'; // Icono de pausa
            }
            estaReproduciendo = !estaReproduciendo;
        });

        // 3. Control para mantener el icono correcto si la música se detiene/inicia por otras razones
        musica.onplay = () => {
            estaReproduciendo = true;
            boton.textContent = '⏸️';
        };
        musica.onpause = () => {
            estaReproduciendo = false;
            boton.textContent = '♪';
        };
    });
</script>
</body>
</html>
