<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Redes Sociales</title>
    <link rel="stylesheet" href="styles.css">

    <!-- ICONOS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: radial-gradient(circle, #160020, #000000);
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
        }

        /* 🔥 TÍTULO ANIMADO 3D 🔥 */
        h1 {
            font-size: 60px;
            font-weight: 900;
            margin-top: 70px;
            color: #00eaff;
            text-shadow: 0 0 20px #00eaff, 0 0 40px #00eaff;
            animation: float 3s infinite ease-in-out, tilt 4s infinite ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0); }
        }

        @keyframes tilt {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            50% { transform: rotateX(6deg) rotateY(-6deg); }
            100% { transform: rotateX(0deg) rotateY(0deg); }
        }

        /* 🔥 BOTONES 3D NEÓN 🔥 */
        .btn {
            width: 350px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 20px;
            font-size: 25px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            color: white;
            box-shadow: 0 0 15px rgba(255,255,255,0.4);
            transform-style: preserve-3d;
            animation: float-btn 3s infinite ease-in-out;
        }

        @keyframes float-btn {
            0% { transform: translateZ(0); }
            50% { transform: translateZ(20px); }
            100% { transform: translateZ(0); }
        }

        .btn:hover {
            transform: scale(1.06) translateZ(30px);
            box-shadow: 0 0 30px white;
        }

        /* Colores personalizados */
        .insta { background: linear-gradient(45deg, #fd1d1d, #fcb045); }
        .tiktok { background: linear-gradient(45deg, #000000, #00f2ea); }
        .twitch { background: linear-gradient(45deg, #9146FF, #b983ff); }
        .youtube { background: linear-gradient(45deg, #ff0000, #ff4d4d); }

        .icon {
            font-size: 32px;
        }
    </style>
</head>
<body>

    <h1>Mis Redes Sociales</h1>

    <!-- INSTAGRAM -->
    <a class="btn insta" href="https://www.instagram.com/valvokaa.ioach.drummer" target="_blank">
        Instagram 
        <i class="fa-brands fa-instagram icon"></i>
    </a>

    <!-- TIKTOK -->
    <a class="btn tiktok" href="https://www.tiktok.com/@valvokaa.drummer" target="_blank">
        TikTok
        <i class="fa-brands fa-tiktok icon"></i>
    </a>

    <!-- TWITCH -->
    <a class="btn twitch" href="https://www.twitch.tv/valvoka_ioachdrummer" target="_blank">
        Twitch
        <i class="fa-brands fa-twitch icon"></i>
    </a>

    <!-- YOUTUBE -->
    <a class="btn youtube" href="https://youtube.com/@Valvoka_drummer" target="_blank">
        YouTube
        <i class="fa-brands fa-youtube icon"></i>
    </a>

</body>
</html>
