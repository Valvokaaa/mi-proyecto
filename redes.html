<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redes Sociales - Menú Gamer</title>

<!-- Íconos FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* Fondo gamer futurista */
body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle, #0a0014, #000000);
    overflow: hidden;
    font-family: Arial;
    color: cyan;
}

h1 {
    font-size: 3rem;
    text-shadow: 0 0 25px cyan, 0 0 50px #ff00ff;
    margin-bottom: 20px;
}

/* Contenedor */
.botonera {
    display: flex;
    flex-direction: column;
    gap: 25px;
    perspective: 1200px;
}

/* --- BOTONES 3D EXTREMOS --- */
.btn {
    position: relative;
    padding: 18px 50px;
    font-size: 1.6rem;
    border-radius: 12px;
    color: white;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 2px;
    overflow: hidden;
    border: none;
    transform-style: preserve-3d;
    transition: 0.25s ease;
    cursor: pointer;
    box-shadow: 
        0 10px 30px rgba(0,255,255,0.3),
        inset 0 0 20px rgba(255,255,255,0.2);
    animation: float 4s ease-in-out infinite;
}

/* Movimiento flotante */
@keyframes float {
    0%   { transform: translateY(0px) rotateX(0deg) rotateY(0deg); }
    50%  { transform: translateY(-10px) rotateX(3deg) rotateY(-3deg); }
    100% { transform: translateY(0px) rotateX(0deg) rotateY(0deg); }
}

/* Glow 3D */
.btn::before {
    content: "";
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.4), transparent);
    opacity: 0;
    transition: 0.25s;
}

/* Hover 3D */
.btn:hover {
    transform: translateY(-15px) rotateX(8deg) rotateY(8deg) scale(1.12);
    box-shadow: 
        0 20px 45px rgba(0,255,255,0.6),
        inset 0 0 30px rgba(255,255,255,0.4);
}
.btn:hover::before {
    opacity: 1;
}

/* Colores por red */
.tiktok { background: #ff0050; box-shadow: 0 0 25px #ff0050; }
.instagram { background: #ff00ff; box-shadow: 0 0 25px #ff00ff; }
.youtube { background: #ff0000; box-shadow: 0 0 25px #ff0000; }
.twitch { background: #a970ff; box-shadow: 0 0 25px #a970ff; }
.volver { background: cyan; color: black; box-shadow: 0 0 25px cyan; }

.btn i { margin-right: 12px; }
</style>
</head>

<body>

<h1>Redes Sociales</h1>

<div class="botonera">

    <a href="#" target="_blank" class="btn tiktok">
        <i class="fab fa-tiktok"></i>TikTok
    </a>

    <a href="#" target="_blank" class="btn instagram">
        <i class="fab fa-instagram"></i>Instagram
    </a>

    <a href="#" target="_blank" class="btn youtube">
        <i class="fab fa-youtube"></i>YouTube
    </a>

    <a href="#" target="_blank" class="btn twitch">
        <i class="fab fa-twitch"></i>Twitch
    </a>

    <a href="menu.html" class="btn volver">
        <i class="fas fa-arrow-left"></i>Volver
    </a>

</div>

</body>
</html>
