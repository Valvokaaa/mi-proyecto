<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redes Sociales - Menú Gamer</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: url("imagenes/kwai.jpg") no-repeat center center fixed;
            background-size: cover;
            color: #00aaff;
            position: relative;
        }
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 40px;
            text-shadow: 0 0 10px #00aaff;
            position: relative;
            z-index: 1;
        }
        .btn {
            padding: 15px 40px;
            border-radius: 10px;
            background: rgba(0, 170, 255, 0.2);
            backdrop-filter: blur(5px);
            color: #00aaff;
            text-decoration: none;
            font-size: 1.5rem;
            border: 2px solid rgba(0, 170, 255, 0.5);
            transition: 0.3s, transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            margin: 10px;
            z-index: 1;
            position: relative;
        }
        .btn:hover {
            background: rgba(0, 170, 255, 0.4);
            box-shadow: 0 0 15px #00aaff, 0 0 30px rgba(0, 170, 255, 0.5) inset;
            transform: scale(1.1);
        }
        .links {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 1;
            position: relative;
        }
    </style>
</head>
<body>

    <h1>Redes Sociales</h1>

    <div class="links">
        <a href="#" class="btn">Instagram</a>
        <a href="#" class="btn">Twitter</a>
        <a href="#" class="btn">TikTok</a>
        <a href="menu.html" class="btn">Volver al Menú</a>
    </div>

</body>
</html>
