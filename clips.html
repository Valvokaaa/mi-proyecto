<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clips - Menú Gamer</title>

<style>
/* ===== Fondo animado retro con neón ===== */
body {
    margin: 0;
    font-family: "Consolas", monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: #00eaff;
    background: radial-gradient(circle at center, #120025, #000000 70%);
    overflow: hidden;
    position: relative;
}

/* Líneas de neón moviéndose (fondo dinámico) */
body::before {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    background: repeating-linear-gradient(
        90deg,
        rgba(0, 255, 255, 0.15) 0px,
        rgba(0, 255, 255, 0.15) 3px,
        transparent 3px,
        transparent 60px
    );
    animation: slide 6s linear infinite;
    transform: rotate(25deg);
    opacity: 0.25;
}

@keyframes slide {
    from { transform: translateX(0) rotate(25deg); }
    to { transform: translateX(-300px) rotate(25deg); }
}

/* ===== Título estilo retro neon glitch ===== */
h1 {
    font-size: 3.5rem;
    letter-spacing: 4px;
    margin-bottom: 30px;
    text-shadow: 
        0 0 10px #00fff2,
        0 0 20px #ff00ff,
        0 0 40px #00fff2;
    animation: glitch 1.8s infinite;
}

/* Efecto glitch suave */
@keyframes glitch {
    0% { text-shadow: 2px 2px #ff00ff, -2px -2px #00fff2; }
    50% { text-shadow: -2px 2px #ff00ff, 2px -2px #00fff2; }
    100% { text-shadow: 2px 2px #ff00ff, -2px -2px #00fff2; }
}

/* ===== Contenedor de botones ===== */
.botonera {
    display: flex;
    flex-direction: column;
    gap: 18px;
    position: relative;
    z-index: 2;
}

/* ===== Botones estilo neón holográfico ===== */
.btn {
    padding: 15px 50px;
    border-radius: 12px;
    background: rgba(0, 255, 255, 0.1);
    color: #00eaff;
    text-decoration: none;
    font-size: 1.7rem;
    border: 2px solid rgba(0, 255, 255, 0.6);
    box-shadow:
        0 0 10px #00fff2,
        inset 0 0 15px #00c8ff;
    transition: 0.3s ease;
    animation: elevar 0.8s ease forwards;
    opacity: 0;
}

/* Animación de aparición */
@keyframes elevar {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

.btn:hover {
    transform: scale(1.15);
    background: rgba(0, 255, 255, 0.35);
    box-shadow:
        0 0 20px #00fff2,
        0 0 40px #ff00ff,
        inset 0 0 40px rgba(0, 255, 255, 0.5);
}

/* Retrasos para cada botón */
.btn:nth-child(1) { animation-delay: 0.4s; }
.btn:nth-child(2) { animation-delay: 0.6s; }
.btn:nth-child(3) { animation-delay: 0.8s; }
.btn:nth-child(4) { animation-delay: 1s; }
</style>

</head>
<body>

    <h1>🎥 Clips</h1>

    <div class="botonera">
        <a href="#" class="btn">Clip 1</a>
        <a href="#" class="btn">Clip 2</a>
        <a href="#" class="btn">Clip 3</a>
        <a href="menu.html" class="btn">Volver al Menú</a>
    </div>

</body>
</html>
