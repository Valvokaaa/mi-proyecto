<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clips - Menú Gamer</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        color: #00ffff;
        overflow: hidden;
        background: linear-gradient(#1a001a, #000000);
        position: relative;
    }

    body::before {
        content: '';
        position: absolute;
        width: 200%;
        height: 200%;
        background: repeating-linear-gradient(0deg, transparent, transparent 20px, rgba(0,255,255,0.2) 20px, rgba(0,255,255,0.2) 21px),
                    repeating-linear-gradient(90deg, transparent, transparent 20px, rgba(255,0,255,0.2) 20px, rgba(255,0,255,0.2) 21px);
        background-size: 100% 100%;
        transform: rotateX(60deg) translateY(50%) scaleY(0.5);
        z-index: 0;
        animation: gridMove 5s linear infinite;
    }

    @keyframes gridMove {
        from { transform: rotateX(60deg) translateY(50%) scaleY(0.5) translateZ(0); }
        to { transform: rotateX(60deg) translateY(50%) scaleY(0.5) translateZ(-500px); }
    }

    h1 {
        font-size: 3rem;
        text-shadow: 0 0 10px #00ffff, 0 0 20px #ff00ff;
        position: relative;
        z-index: 1;
        animation: fadeIn 1.5s ease-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .botonera {
        display: flex;
        flex-direction: column;
        gap: 20px;
        position: relative;
        z-index: 1;
    }

    .btn {
        padding: 15px 40px;
        border-radius: 10px;
        background: rgba(0, 255, 255, 0.25);
        color: #00ffff;
        text-decoration: none;
        font-size: 1.5rem;
        border: 2px solid rgba(0, 255, 255, 0.6);
        transition: 0.3s, transform 0.3s, box-shadow 0.3s;
        cursor: pointer;
        display: inline-block;
        text-align: center;
        animation: botonEntrada 0.8s forwards;
        opacity: 0;
        transform: translateY(20px);
    }

    .btn:nth-child(1) { animation-delay: 0.5s; }
    .btn:nth-child(2) { animation-delay: 0.8s; }
    .btn:nth-child(3) { animation-delay: 1.1s; }

    @keyframes botonEntrada {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn:hover {
        background: rgba(0, 255, 255, 0.5);
        box-shadow: 0 0 15px #00ffff, 0 0 30px rgba(0, 255, 255, 0.5) inset;
        transform: scale(1.1);
    }
</style>
</head>
<body>
    <h1>Clips</h1>
    <div class="botonera">
        <a href="#" class="btn">Clip 1</a>
        <a href="#" class="btn">Clip 2</a>
        <a href="#" class="btn">Clip 3</a>
        <a href="menu.html" class="btn">Volver al Menú</a>
    </div>
</body>
</html>
