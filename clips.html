<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clips - Menú Gamer</title>
<style>
  body {
    margin: 0;
    font-family: 'Courier New', Courier, monospace;
    height: 100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #00ffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: start;
    padding: 20px;
    overflow-x: hidden;
  }

  h1 {
    font-size: 3rem;
    text-shadow:
      0 0 5px #00ffff,
      0 0 10px #00ffff,
      0 0 20px #00ffff,
      0 0 40px #00ffff;
    margin-bottom: 10px;
    animation: neonGlow 2s ease-in-out infinite alternate;
  }

  @keyframes neonGlow {
    from { text-shadow:0 0 10px #00ffff,0 0 20px #00ffff,0 0 30px #00ffff,0 0 40px #00ffff; }
    to   { text-shadow:0 0 20px #00ffff,0 0 30px #00ffff,0 0 40px #00ffff,0 0 60px #00ffff; }
  }

  #uploadForm {
    margin-bottom: 30px;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  #uploadForm input[type="file"] {
    color: #00ffff;
    border-radius: 5px;
    cursor: pointer;
  }

  #uploadForm button {
    padding: 10px 20px;
    background: #00ffff;
    color: #000;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow:0 0 10px #00ffff,inset 0 0 10px #00ffff;
  }

  #uploadForm button:hover {
    background: #00b3b3;
    box-shadow:0 0 20px #00ffff,inset 0 0 20px #00ffff;
    transform: scale(1.05);
  }

  #clipList {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    width: 100%;
    max-width: 900px;
  }

  .clipCard {
    background: #0c0c3a;
    border: 2px solid #00ffff;
    border-radius: 12px;
    padding: 10px;
    width: 280px;
    box-shadow:0 0 10px #00ffff,inset 0 0 10px #00ffff;
    animation: fadeInUp 0.7s ease forwards;
  }

  .clipCard video {
    width: 100%;
    border-radius: 8px;
  }

  .clipCard button {
    margin-top: 8px;
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    background: #ff0057;
    color: white;
    font-weight: bold;
    cursor: pointer;
    box-shadow:0 0 10px #ff0057,inset 0 0 10px #ff0057;
    transition: all 0.3s ease;
  }

  .clipCard button:hover {
    background: #cc0047;
    box-shadow:0 0 20px #ff0057,inset 0 0 20px #ff0057;
    transform: scale(1.05);
  }

  #message {
    margin-bottom: 15px;
    font-weight: bold;
    height: 24px;
    color: #00ffcc;
    text-shadow: 0 0 5px #00ffcc;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); } 
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<h1>Clips</h1>

<div id="message"></div>

<form id="uploadForm">
  <input type="file" id="fileInput" accept="video/*" />
  <button type="submit">Subir Clip</button>
</form>

<div id="clipList"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseUrl = 'https://owucpcdmojsksraccwny.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93dWNwY2Rtb2pza3NyYWNjd255Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQwMjg1NzQsImV4cCI6MjA3OTYwNDU3NH0.gh9xlOb19aG_2G6tmc46IKay1G4okZiM1ii2wWxB4FY';
  const supabase = supabase.createClient(supabaseUrl, supabaseKey);
  const bucketName = 'clips';

  const fileInput = document.getElementById('fileInput');
  const uploadForm = document.getElementById('uploadForm');
  const clipList = document.getElementById('clipList');
  const message = document.getElementById('message');

  async function listarClips() {
    clipList.innerHTML = '';
    message.textContent = 'Cargando clips...';

    const { data, error } = await supabase.storage.from(bucketName).list('', { limit: 100, sortBy: { column: 'created_at', order: 'desc' } });
    
    if (error) {
      message.textContent = 'Error cargando clips.';
      console.error(error);
      return;
    }

    if (data.length === 0) {
      message.textContent = 'No hay clips subidos.';
      return;
    }

    message.textContent = '';
    for (const file of data) {
      const { data: urlData, error: urlError } = supabase.storage.from(bucketName).getPublicUrl(file.name);
      if (urlError) { console.error(urlError); continue; }
      const publicUrl = urlData.publicUrl;
      const clipCard = document.createElement('div');
      clipCard.classList.add('clipCard');
      clipCard.innerHTML = `
        <video controls preload="metadata" src="${publicUrl}"></video>
        <button data-filename="${file.name}">Eliminar</button>
      `;
      clipList.appendChild(clipCard);

      clipCard.querySelector('button').addEventListener('click', async () => {
        if (!confirm('¿Seguro quieres eliminar este clip?')) return;
        const { error: delError } = await supabase.storage.from(bucketName).remove([file.name]);
        if (delError) { alert('Error eliminando clip'); console.error(delError); return; }
        listarClips();
      });
    }
  }

  uploadForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    message.textContent = '';

    const file = fileInput.files[0];
    if (!file) { message.textContent = 'Selecciona un video.'; return; }
    if (!file.type.startsWith('video/')) { message.textContent = 'El archivo debe ser un video.'; return; }

    const fileName = `${Date.now()}_${file.name}`;
    message.textContent = 'Subiendo clip...';

    const { error } = await supabase.storage.from(bucketName).upload(fileName, file, { cacheControl: '3600', upsert: false });
    if (error) { message.textContent = 'Error subiendo clip.'; console.error(error); return; }

    message.textContent = 'Clip subido con éxito!';
    fileInput.value = '';
    listarClips();
  });

  listarClips();
</script>

</body>
</html>
