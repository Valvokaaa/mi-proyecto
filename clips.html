<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clips - Menú Gamer</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 20px;
        background: linear-gradient(135deg, #120033, #1a0055);
        color: #00eaff;
    }

    h1 {
        font-size: 3rem;
        text-shadow: 0 0 12px #00eaff;
        margin-bottom: 20px;
    }

    .upload-box {
        margin-bottom: 30px;
    }

    .btn-upload {
        background: #00eaff;
        padding: 12px 25px;
        border-radius: 10px;
        color: #000;
        font-weight: bold;
        border: none;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn-upload:hover {
        background: #55ffff;
        transform: scale(1.05);
    }

    .clips-container {
        margin-top: 30px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
    }

    video {
        width: 80%;
        max-width: 500px;
        border-radius: 10px;
        box-shadow: 0 0 15px #00eaff;
    }

    .btn-menu {
        margin-top: 30px;
        text-decoration: none;
        background: #00aaff;
        color: white;
        padding: 10px 20px;
        border-radius: 10px;
        display: inline-block;
    }
</style>
</head>

<body>

<h1>Clips</h1>

<div class="upload-box">
    <input type="file" id="clipInput" accept="video/*">
    <button class="btn-upload" onclick="uploadClip()">Subir Clip</button>
</div>

<h2>Clips Subidos</h2>

<div id="clipsList" class="clips-container"></div>

<a href="menu.html" class="btn-menu">Volver al menú</a>


<script>
// -----------------------------------------
//   CONFIGURACIÓN DE SUPABASE
// -----------------------------------------
const SUPABASE_URL = "https://owucpcdmojsksraccwny.supabase.co"; 
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93dWNwY2Rtb2pza3NyYWNjd255Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQwMjg1NzQsImV4cCI6MjA3OTYwNDU3NH0.gh9xlOb19aG_2G6tmc46IKay1G4okZiM1ii2wWxB4FY";

const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// -----------------------------------------
//   Cargar clips al abrir la página
// -----------------------------------------
async function loadClips() {
    const list = document.getElementById("clipsList");
    list.innerHTML = "<p>Cargando clips...</p>";

    const { data, error } = await supabase
        .from("videos")
        .select("*");

    if (error) {
        list.innerHTML = "<p>Error al cargar clips.</p>";
        return;
    }

    list.innerHTML = "";

    data.forEach(video => {
        const vid = document.createElement("video");
        vid.src = video.url;
        vid.controls = true;
        list.appendChild(vid);
    });

    if (data.length === 0) {
        list.innerHTML = "<p>No hay clips subidos aún.</p>";
    }
}

loadClips();

// -----------------------------------------
//   Subir clip al bucket y a la base
// -----------------------------------------
async function uploadClip() {
    const file = document.getElementById("clipInput").files[0];

    if (!file) {
        alert("Selecciona un video primero.");
        return;
    }

    const fileName = Date.now() + "-" + file.name;

    // Subir a Storage
    const { data: storageData, error: storageError } = await supabase
        .storage
        .from("clips")
        .upload(fileName, file);

    if (storageError) {
        alert("Error al subir el clip.");
        return;
    }

    // Obtener URL pública
    const { data: publicUrl } = supabase
        .storage
        .from("clips")
        .getPublicUrl(fileName);

    // Guardar en tabla
    await supabase
        .from("videos")
        .insert([{ url: publicUrl.publicUrl }]);

    alert("Clip subido correctamente 🎉");

    loadClips();
}

</script>

</body>
</html>
