<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clips - Menú Gamer</title>

<style>
/* ===== Fondo animado retro con neón ===== */
body {
    margin: 0;
    font-family: "Consolas", monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    text-align: center;
    color: #00eaff;
    background: radial-gradient(circle at center, #120025, #000000 70%);
    overflow-y: auto;
    position: relative;
    padding-top: 40px;
}

/* Líneas neón animadas */
body::before {
    content: "";
    position: fixed;
    width: 200%;
    height: 200%;
    background: repeating-linear-gradient(
        90deg,
        rgba(0, 255, 255, 0.15) 0px,
        rgba(0, 255, 255, 0.15) 3px,
        transparent 3px,
        transparent 60px
    );
    animation: slide 6s linear infinite;
    transform: rotate(25deg);
    opacity: 0.25;
    z-index: 0;
}

@keyframes slide {
    from { transform: translateX(0) rotate(25deg); }
    to { transform: translateX(-300px) rotate(25deg); }
}

/* Título estilo glitch */
h1 {
    font-size: 3.5rem;
    letter-spacing: 4px;
    margin-bottom: 20px;
    text-shadow: 
        0 0 10px #00fff2,
        0 0 20px #ff00ff,
        0 0 40px #00fff2;
    animation: glitch 1.8s infinite;
    z-index: 2;
}

@keyframes glitch {
    0% { text-shadow: 2px 2px #ff00ff, -2px -2px #00fff2; }
    50% { text-shadow: -2px 2px #ff00ff, 2px -2px #00fff2; }
    100% { text-shadow: 2px 2px #ff00ff, -2px -2px #00fff2; }
}

/* Botón neon para subir video */
input[type="file"] {
    display: none;
}

.label-subir {
    padding: 15px 45px;
    background: rgba(0, 255, 255, 0.25);
    border: 2px solid #00eaff;
    color: #00eaff;
    border-radius: 10px;
    font-size: 1.4rem;
    cursor: pointer;
    text-shadow: 0 0 10px #00ffff;
    box-shadow:
        0 0 10px #00fff2,
        inset 0 0 15px #00c8ff;
    transition: 0.3s;
    z-index: 2;
}

.label-subir:hover {
    transform: scale(1.1);
    background: rgba(0, 255, 255, 0.5);
}

/* Contenedor de los videos */
#galeria {
    margin-top: 40px;
    width: 80%;
    display: flex;
    flex-wrap: wrap;
    gap: 30px;
    justify-content: center;
    z-index: 2;
}

/* Cada video */
.video-box {
    border: 2px solid #00eaff;
    padding: 10px;
    border-radius: 10px;
    background: rgba(0, 255, 255, 0.15);
    box-shadow: 0 0 15px #00eaff;
}

video {
    width: 300px;
    border-radius: 10px;
}
</style>

</head>
<body>

    <h1>🎥 Clips Subidos</h1>

    <!-- Botón para subir video -->
    <label for="subirVideo" class="label-subir">Subir Clip</label>
    <input type="file" id="subirVideo" accept="video/*" multiple>

    <!-- Galería donde aparecerán los clips -->
    <div id="galeria"></div>

<script>
document.getElementById("subirVideo").addEventListener("change", function(event) {
    const archivos = event.target.files;

    for (let archivo of archivos) {
        const url = URL.createObjectURL(archivo);

        // crear video
        const contenedor = document.createElement("div");
        contenedor.classList.add("video-box");

        const video = document.createElement("video");
        video.src = url;
        video.controls = true;

        contenedor.appendChild(video);
        document.getElementById("galeria").appendChild(contenedor);
    }
});
</script>

</body>
</html>
