<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clips - Menú Gamer</title>

<!-- Librería Supabase v2 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
    background: linear-gradient(135deg, #120033, #1a0055);
    color: #00ffff;
}

h1 {
    font-size: 2.5rem;
    text-shadow: 0 0 8px #00ffff, 0 0 20px #ff00ff;
}

.upload-box { margin-bottom: 20px; }

button, .btn-menu {
    padding: 12px 25px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

button {
    background: #00ffff;
    color: #000;
}

button:hover { background: #55ffff; transform: scale(1.05); }

.clips-container { margin-top: 20px; display: flex; flex-direction: column; gap: 20px; align-items: center; }

video { width: 80%; max-width: 500px; border-radius: 10px; box-shadow: 0 0 15px #00ffff; }

.btn-menu {
    text-decoration: none;
    background: #00aaff;
    color: white;
    display: inline-block;
    margin-top: 20px;
}

.btn-menu:hover { background: #00eaff; }
</style>
</head>
<body>

<h1>Clips</h1>

<div class="upload-box">
    <input type="file" id="clipInput" accept="video/*">
    <button id="btnUpload">Subir Clip</button>
</div>

<div id="clipsList" class="clips-container"></div>

<a href="menu.html" class="btn-menu">Volver al menú</a>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const SUPABASE_URL = "https://owucpcdmojsksraccwny.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93dWNwY2Rtb2pza3NyYWNjd255Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQwMjg1NzQsImV4cCI6MjA3OTYwNDU3NH0.gh9xlOb19aG_2G6tmc46IKay1G4okZiM1ii2wWxB4FY";
    
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const btnUpload = document.getElementById("btnUpload");
    const clipInput = document.getElementById("clipInput");
    const clipsList = document.getElementById("clipsList");

    async function loadClips() {
        clipsList.innerHTML = "<p>Cargando clips...</p>";
        const { data, error } = await supabase.from("videos").select("*");
        if (error) { clipsList.innerHTML = "<p>Error al cargar clips.</p>"; return; }
        clipsList.innerHTML = "";
        if (data.length === 0) { clipsList.innerHTML = "<p>No hay clips subidos aún.</p>"; return; }
        data.forEach(video => {
            const vid = document.createElement("video");
            vid.src = video.url;
            vid.controls = true;
            clipsList.appendChild(vid);
        });
    }

    async function uploadClip() {
        const file = clipInput.files[0];
        if (!file) { alert("Selecciona un video primero."); return; }
        const fileName = Date.now() + "-" + file.name;
        const { error: storageError } = await supabase.storage.from("clips").upload(fileName, file);
        if (storageError) { alert("Error al subir clip: " + storageError.message); return; }
        const { data: publicUrl } = supabase.storage.from("clips").getPublicUrl(fileName);
        await supabase.from("videos").insert([{ url: publicUrl.publicUrl }]);
        alert("Clip subido correctamente 🎉");
        clipInput.value = "";
        loadClips();
    }

    btnUpload.addEventListener("click", uploadClip);

    loadClips();
});
</script>

</body>
</html>
